services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-latmay}
      POSTGRES_USER: ${DB_USER:-latmay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - latmay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latmay -d latmay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  latmay_postgres_data:
